<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduWow Worksheet</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #a0e9fd;
    margin: 0;
    padding: 0;
}
header {
    text-align: center;
    padding: 20px;
    background: #3ca2f5;
    color: white;
    font-size: 2em;
    font-weight: bold;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}
.container {
    max-width: 800px;
    margin: 20px auto;
    background: rgba(255,255,255,0.9);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(to right,#2b6cb0,#3ca2f5);
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
}
button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.subject-btn {width: 150px;}
.activity {margin: 10px 0;}
textarea {width: 100%; border-radius: 10px; padding: 10px; border: 1px solid #ddd; resize: none;}
input[type="text"] {width: 100%; border-radius: 10px; padding: 8px; border: 1px solid #ddd;}
.activity-header {display:flex; justify-content: space-between; align-items:center; margin-top:15px;}
.feedback {font-size:0.9em; color:green; margin-top:5px;}
</style>
</head>
<body>
<header>🌟 EduWow Worksheets</header>

<div class="container" id="subjectContainer">
    <h2>Select a Subject</h2>
    <div id="subjectButtons"></div>
</div>

<div class="container hidden" id="activityContainer">
    <h2 id="activitySubject">Subject Activities</h2>
    <div id="activitiesList"></div>
    <button id="submitBtn">Submit Answers</button>
    <button id="backBtn">Back to Subjects</button>
</div>

<script>
// Detect current user
let currentUser = JSON.parse(localStorage.getItem('currentUser'));
if(!currentUser){
    alert('No user logged in'); window.location.href='index.html';
}

// Subjects
const subjects = ["Filipino","English","Math","Mother Tongue","MAPEH"];

// Sample activities per subject
let sampleActivities = {
    "Filipino":["Gumawa ng pangungusap gamit ang salitang 'Araw'","Tukuyin ang pantig sa mga salita","Bumuo ng maikling kwento","Ihambing ang dalawang tula","Isalin sa Filipino ang pangungusap","Punan ang patlang sa talata","Tukuyin ang simuno at panaguri","Magkwento tungkol sa paboritong guro"],
    "English":["Write a paragraph about your day","Underline the verbs in the sentence","Match words with their meanings","Write a short story","Translate to English: 'Mahal kita'","Correct the grammar mistakes","Answer the comprehension questions","Describe your favorite animal"],
    "Math":["Add the following numbers","Subtract the numbers","Solve multiplication problems","Solve division problems","Find the missing number in sequences","Draw shapes and label","Solve word problems","Calculate perimeter of a rectangle"],
    "Mother Tongue":["Gumawa ng tula","Kumpletuhin ang pangungusap","Tukuyin ang bahagi ng pananalita","Isalin ang pangungusap","Magkwento tungkol sa pamilya","Punan ang talata","Ihambing ang dalawang kwento","Sagutin ang mga tanong sa pakikinig"],
    "MAPEH":["Draw your favorite sports equipment","List 5 healthy foods","Write a dance sequence","Identify musical instruments","Name the parts of the body","Explain importance of exercise","Color a music note","Describe a sport you like"]
};

// Store activities in localStorage if not exists
if(!localStorage.getItem('activities')){
    localStorage.setItem('activities',JSON.stringify(sampleActivities));
}

// Render subject buttons
const subjectButtons = document.getElementById('subjectButtons');
subjects.forEach(sub=>{
    let btn = document.createElement('button');
    btn.innerText = sub;
    btn.classList.add('subject-btn');
    btn.onclick = ()=>showActivities(sub);
    subjectButtons.appendChild(btn);
});

// Show activities
function showActivities(subject){
    document.getElementById('subjectContainer').classList.add('hidden');
    document.getElementById('activityContainer').classList.remove('hidden');
    document.getElementById('activitySubject').innerText = subject + " Activities";

    const listDiv = document.getElementById('activitiesList');
    listDiv.innerHTML = "";

    let activities = JSON.parse(localStorage.getItem('activities'))[subject];

    activities.forEach((act, i)=>{
        let div = document.createElement('div');
        div.classList.add('activity');

        if(currentUser.role === "teacher"){
            div.innerHTML = `
            <div class="activity-header">
                <input type="text" value="${act}" id="act-${i}">
                <button onclick="deleteActivity(${i},'${subject}')">❌</button>
            </div>
            `;
        } else {
            div.innerHTML = `
            <label>${i+1}. ${act}</label>
            <textarea id="answer-${i}" rows="2" placeholder="Your answer here..."></textarea>
            <div class="feedback" id="feedback-${i}"></div>
            `;
        }

        listDiv.appendChild(div);
    });

    if(currentUser.role === "teacher"){
        let addBtn = document.createElement('button');
        addBtn.innerText = "➕ Add Activity";
        addBtn.onclick = ()=>addActivity(subject);
        listDiv.appendChild(addBtn);
    }
}

// Add activity (teacher)
function addActivity(subject){
    let newAct = prompt("Enter new activity:");
    if(newAct){
        let activities = JSON.parse(localStorage.getItem('activities'));
        activities[subject].push(newAct);
        localStorage.setItem('activities',JSON.stringify(activities));
        showActivities(subject);
    }
}

// Delete activity (teacher)
function deleteActivity(index,subject){
    let activities = JSON.parse(localStorage.getItem('activities'));
    activities[subject].splice(index,1);
    localStorage.setItem('activities',JSON.stringify(activities));
    showActivities(subject);
}

// Back to subjects
document.getElementById('backBtn').onclick = ()=>{
    document.getElementById('activityContainer').classList.add('hidden');
    document.getElementById('subjectContainer').classList.remove('hidden');
};

// Submit answers (student)
document.getElementById('submitBtn').onclick = ()=>{
    if(currentUser.role !== "student") return;

    const subject = document.getElementById('activitySubject').innerText.replace(" Activities","");
    let activities = JSON.parse(localStorage.getItem('activities'))[subject];
    let submissions = JSON.parse(localStorage.getItem('submissions'))||{};
    if(!submissions[subject]) submissions[subject] = {};
    submissions[subject][currentUser.name] = [];

    activities.forEach((act,i)=>{
        let ans = document.getElementById(`answer-${i}`).value;
        submissions[subject][currentUser.name].push({activity:act, answer:ans, score:null, feedback:null});
    });

    localStorage.setItem('submissions',JSON.stringify(submissions));
    alert('Answers submitted successfully!');
    document.getElementById('activityContainer').classList.add('hidden');
    document.getElementById('subjectContainer').classList.remove('hidden');
};

// Optional: teachers can check submissions and provide scores/feedback
// You can add a separate button or implement it later
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Progress Monitor</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #d0f0c0, #a8e6a3);
    margin: 0;
    padding: 0;
}
header {
    background: linear-gradient(90deg, #4caf50, #81c784);
    color: white;
    text-align: center;
    padding: 25px;
    font-size: 2em;
    font-weight: bold;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
}
.student-card {
    background: #f0fff0;
    border-radius: 20px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    margin: 20px 0;
    padding: 20px;
}
.student-card h3 {
    margin-bottom: 15px;
    font-size: 1.7em;
    color: #2e7d32;
}
.section {
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    color: white;
}
.section h4 {
    margin-bottom: 10px;
    font-size: 1.2em;
    font-weight: bold;
}
.game-section {
    background: linear-gradient(90deg,#66bb6a,#43a047);
}
.worksheet-section {
    background: linear-gradient(90deg,#81c784,#4caf50);
}
.collab-section {
    background: linear-gradient(90deg,#a5d6a7,#81c784);
}
.activity-list {
    list-style-type: disc;
    padding-left: 20px;
}
.badge {
    display: inline-block;
    margin: 5px 5px 0 0;
    padding: 6px 12px;
    background: linear-gradient(45deg,#c8e6c9,#a5d6a7);
    border-radius: 12px;
    color: #1b5e20;
    font-weight: 600;
    font-size: 0.9em;
}
.progress-bar-container {
    background: rgba(255,255,255,0.4);
    border-radius: 15px;
    overflow: hidden;
    margin-top: 8px;
    height: 20px;
}
.progress-bar {
    height: 100%;
    background: rgba(255,255,255,0.7);
    width: 0%;
    text-align: center;
    font-size: 0.8em;
    font-weight: bold;
    line-height: 20px;
}
</style>
</head>
<body>

<header>🌱 Teacher Progress Dashboard</header>

<div class="container" id="monitorContainer">
<!-- Student cards will appear here -->
</div>

<script>
// ===== Load localStorage data =====
let collabGroups = JSON.parse(localStorage.getItem('collabGroups')) || {};
let eduPoints = parseInt(localStorage.getItem('eduPoints')) || 0;
let eduBadges = JSON.parse(localStorage.getItem('eduBadges')) || [];
let groupsCollab = JSON.parse(localStorage.getItem('groups')) || {};
let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {name:'Teacher', role:'teacher'};

// ===== Collect all students =====
function getAllStudents(){
    let studentSet = new Set();
    for(let g in collabGroups){ collabGroups[g].members.forEach(m=>studentSet.add(m)); }
    for(let g in groupsCollab){ groupsCollab[g].members.forEach(m=>studentSet.add(m)); }
    return Array.from(studentSet);
}

// ===== Render Monitor =====
function renderMonitor(){
    const container = document.getElementById('monitorContainer');
    container.innerHTML='';
    let students = getAllStudents();

    students.forEach(student=>{
        // --- Worksheet data ---
        let worksheetActivities = [];
        let worksheetScore = 0;
        for(let g in collabGroups){
            if(collabGroups[g].members.includes(student)){
                for(let cat in collabGroups[g].activities){
                    collabGroups[g].activities[cat].forEach(a=>{
                        worksheetActivities.push(`${cat}: ${a.activity} (${a.point} pts)`);
                        worksheetScore += a.point || 0;
                    });
                }
            }
        }

        // --- Group collaboration ---
        let collabTasks = [];
        for(let g in groupsCollab){
            if(groupsCollab[g].members.includes(student)){
                collabTasks.push(`${g}: ${groupsCollab[g].task || 'No task yet'}`);
            }
        }

        // --- Game points & badges ---
        let studentPoints = (currentUser.name===student) ? eduPoints : 0;
        let studentBadges = (currentUser.name===student) ? eduBadges : [];

        // --- Progress bar (worksheet + game normalized) ---
        let totalProgress = Math.min(100, worksheetScore + studentPoints);

        const card = document.createElement('div');
        card.className='student-card';
        card.innerHTML = `
            <h3>👦 ${student}</h3>

            <div class="section game-section">
                <h4>🎮 Game Progress</h4>
                <p>Points: ${studentPoints}</p>
                <div>Badges: ${studentBadges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" style="width:${studentPoints}%">${studentPoints}%</div>
                </div>
            </div>

            <div class="section worksheet-section">
                <h4>📄 Worksheet Activities</h4>
                <p>Total Points: ${worksheetScore}</p>
                <ul class="activity-list">
                    ${worksheetActivities.map(a=>`<li>${a}</li>`).join('')}
                </ul>
            </div>

            <div class="section collab-section">
                <h4>👥 Group Collaboration</h4>
                <ul class="activity-list">
                    ${collabTasks.map(t=>`<li>${t}</li>`).join('')}
                </ul>
            </div>
        `;
        container.appendChild(card);
    });
}

renderMonitor();

// ===== Real-time update =====
window.addEventListener('storage', function(e){
    if(['collabGroups','eduPoints','eduBadges','groups'].includes(e.key)){
        collabGroups = JSON.parse(localStorage.getItem('collabGroups')) || {};
        eduPoints = parseInt(localStorage.getItem('eduPoints')) || 0;
        eduBadges = JSON.parse(localStorage.getItem('eduBadges')) || [];
        groupsCollab = JSON.parse(localStorage.getItem('groups')) || {};
        renderMonitor();
    }
});
</script>

</body>
</html>
